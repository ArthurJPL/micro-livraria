syntax = "proto3";

service WishlistService {
    rpc AddWishlistItem(WishlistItemPayload) returns (WishlistItem) {}
    rpc ListWishlistItems(WishlistEmpty) returns (WishlistResponse) {}
    rpc RemoveWishlistItem(WishlistItemIdPayload) returns (WishlistEmpty) {}
}

message WishlistItemIdPayload {
    int32 id = 1;
}

message WishlistItemPayload {
    int32 bookId = 1;
    string bookName = 2;
    string userId = 3;
}

message WishlistItem {
    int32 id = 1;
    int32 bookId = 2;
    string bookName = 3;
    string userId = 4;
    string createdAt = 5;
}

message WishlistResponse {
    repeated WishlistItem items = 1;
}

message WishlistEmpty {}
