openapi: 3.0.3

info:
    title: Micro-Livraria - Wishlist API
    version: 1.0.0
    description: |
        API REST da lista de desejos da Micro-Livraria.

        O frontend chama o Controller na porta 3000. O Controller encaminha
        as operações para o microsserviço Wishlist via gRPC na porta interna 3003.

        Esta API não possui autenticação e é destinada a fins didáticos.
    license:
        name: MIT
        url: https://opensource.org/licenses/MIT

servers:
    - url: http://{host}:{port}
      description: Ambiente local / Docker Compose
      variables:
          host:
              default: localhost
              description: Host do Controller
          port:
              default: '3000'
              description: Porta do Controller

security: []

tags:
    - name: Wishlist
      description: Operações da lista de desejos

paths:
    /wishlist:
        get:
            tags:
                - Wishlist
            summary: Lista todos os itens da lista de desejos
            description: Retorna um array com todos os itens, independentemente do userId.
            operationId: listWishlistItems
            responses:
                '200':
                    description: Lista retornada com sucesso
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/WishlistItem'
                '500':
                    $ref: '#/components/responses/InternalServerError'

        post:
            tags:
                - Wishlist
            summary: Cria um item na lista de desejos
            description: |
                Cria um novo item. A API não bloqueia duplicidade de bookId.
                O frontend evita duplicidade alternando entre adicionar e remover.
            operationId: createWishlistItem
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/WishlistItemInput'
                        example:
                            bookId: 1
                            bookName: Refactoring
                            userId: frontend
            responses:
                '201':
                    description: Item criado com sucesso
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WishlistItem'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /wishlist/{id}:
        delete:
            tags:
                - Wishlist
            summary: Remove um item da lista de desejos
            description: Remove o item pelo ID do item da wishlist, não pelo bookId.
            operationId: deleteWishlistItem
            parameters:
                - name: id
                  in: path
                  required: true
                  description: ID do item da lista de desejos
                  schema:
                      type: integer
                      format: int32
                      minimum: 1
                  example: 1
            responses:
                '204':
                    description: Item removido com sucesso
                '400':
                    $ref: '#/components/responses/BadRequest'
                '404':
                    description: Item não encontrado
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                error: wishlist item not found
                '500':
                    $ref: '#/components/responses/InternalServerError'

components:
    schemas:
        WishlistItem:
            type: object
            description: Item armazenado na lista de desejos
            required:
                - id
                - bookId
                - bookName
                - userId
                - createdAt
            properties:
                id:
                    type: integer
                    format: int32
                    readOnly: true
                    description: Identificador do item na wishlist
                    example: 1
                bookId:
                    type: integer
                    format: int32
                    description: ID do livro no Inventory
                    example: 1
                bookName:
                    type: string
                    description: Nome do livro para exibição
                    example: Refactoring
                userId:
                    type: string
                    description: Identificador do usuário que adicionou o item
                    example: frontend
                createdAt:
                    type: string
                    format: date-time
                    readOnly: true
                    description: Data e hora de criação
                    example: '2026-11-13T01:18:44.672Z'

        WishlistItemInput:
            type: object
            description: Dados para criar um item na lista de desejos
            required:
                - bookId
            properties:
                bookId:
                    type: integer
                    format: int32
                    minimum: 1
                    description: ID do livro no Inventory
                    example: 1
                bookName:
                    type: string
                    description: Nome do livro para exibição
                    example: Refactoring
                userId:
                    type: string
                    description: Identificador do usuário
                    example: frontend

        Error:
            type: object
            required:
                - error
            properties:
                error:
                    type: string
                    description: Descrição do erro
                    example: bookId is required and must be a positive integer

    responses:
        BadRequest:
            description: Dados de entrada inválidos
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
                    examples:
                        bookIdInvalido:
                            summary: bookId ausente ou inválido
                            value:
                                error: bookId is required and must be a positive integer
                        idInvalido:
                            summary: ID inválido na remoção
                            value:
                                error: id is required and must be a positive integer

        InternalServerError:
            description: Falha interna ou de comunicação com o microsserviço Wishlist
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
                    example:
                        error: something failed :(
